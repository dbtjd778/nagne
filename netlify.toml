[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "24"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[context.deploy-preview.environment]
  SITE_ENV = "preview"

[context.branch-deploy.environment]
  SITE_ENV = "preview"

[[redirects]]
  from = "https://allsites-mine.netlify.app/*"
  to = "https://vsites.co.kr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.vsites.co.kr/*"
  to = "https://vsites.co.kr/:splat"
  status = 301
  force = true

# Next.js static export supplies real HTML for each route. No SPA catch-all.
# scripts/postbuild.mjs writes context-aware security/noindex headers to out/_headers.
